plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "sts.mixins.json"
        mixinConfig "sts-forge.mixins.json"
    }
    mixin {
        defaultRefmapName = "sts-forge.refmap.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // S-Lib common code
    modImplementation("maven.modrinth:s-lib:${rootProject.s_lib_version}-forge")

    // YACL
    modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-forge"

    // Legendary Tooltips (compat)
    modCompileOnly "curse.maven:legendary-tooltips-532127:4662781"
    modLocalRuntime "curse.maven:legendary-tooltips-532127:4662781"
    // Prism (compat)
    modCompileOnly "curse.maven:prism-lib-638111:4650325"
    modLocalRuntime "curse.maven:prism-lib-638111:4650325"
    // Iceberg (compat)
    modCompileOnly "curse.maven:iceberg-520110:5838149"
    modLocalRuntime "curse.maven:iceberg-520110:5838149"

    // CTA (Runtime)
    modLocalRuntime "curse.maven:custom-tooltip-api-1508021:8484269"

    // quilt-parsers is a transitive runtime dependency of YACL Forge (used by GsonConfigSerializer)
    // Loom does not propagate JarJar (Jar-in-Jar) automatically so we declare it explicitly
    forgeRuntimeLibrary "org.quiltmc.parsers:gson:0.3.0"
    forgeRuntimeLibrary "org.quiltmc.parsers:json:0.3.0"

    // EMI
    modCompileOnly "dev.emi:emi-forge:${rootProject.emi_version}"
    modLocalRuntime "dev.emi:emi-forge:${rootProject.emi_version}"
    // EMI Effect
    modLocalRuntime "curse.maven:emiffect-status-effects-emi-plugin-735528:4901311"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
